}
function linearHighlights(){
  // Match complete geometric lines at the snapped intersection, not disconnected fragments.
  const c=model.c,hit=scene.ints.find(p=>dist(c,p)<8);if(!hit)return;
  const through=scene.seg.filter(s=>alignment(s,c,model.a));
  const branch=scene.seg.filter(s=>alignment(s,c,model.b)&&!through.includes(s));
  if(!through.length||!branch.length)return;
  // Collect collinear pieces and display them as continuous geometry through the vertex.
  function highlightFamily(seed,cls,rayOnly=false){
    const axis=unit(minus(seed.b,seed.a));
    const matching=scene.seg.filter(s=>{
      const v=unit(minus(s.b,s.a));
      const cross=Math.abs(v.x*axis.y-v.y*axis.x);
      const d=Math.abs((s.a.x-c.x)*axis.y-(s.a.y-c.y)*axis.x);
      return cross<.025&&d<6;
    });
    let vals=matching.flatMap(s=>[s.a,s.b].map(p=>(p.x-c.x)*axis.x+(p.y-c.y)*axis.y));
    if(!vals.length)return;
    let lo=Math.min(...vals),hi=Math.max(...vals);
    if(rayOnly){const sign=direction(model.b).x*axis.x+direction(model.b).y*axis.y; if(sign>=0)lo=0;else hi=0;}
    const p=plus(c,mul(axis,lo)),q=plus(c,mul(axis,hi));
    make('line',{x1:p.x,y1:p.y,x2:q.x,y2:q.y,class:cls},overlay);
  }
  highlightFamily(through[0],'identified-line');
  // The second geometric line continues through the vertex whenever the drawing does.
  highlightFamily(branch[0],'identified-ray');
}
function handle(p,action,cls='handle',r=12){make('circle',{cx:p.x,cy:p.y,r,class:cls,'data-action':action},layer)}
function draw(){rootLayer.replaceChildren();rootOverlay.replaceChildren();
for(const obj of instances){tool=obj.kind;model=obj.model;
const group=make('g',{'data-instance':obj.id},rootLayer);
const high=make('g',{'data-instance':obj.id},rootOverlay);
layer=group;overlay=high;

if(tool==='vertical'){
 const {c,a,b}=model,arms=model.arms||(model.arms=[165,125,145,180]);
 verticalHighlights();
 actualSectors(c,a,b);
 for(let j=0;j<4;j++){
  const t=j===0?a:j===1?a+Math.PI:j===2?b:b+Math.PI;
  const endpoint=plus(c,mul(direction(t),arms[j]));
  make('line',{x1:c.x,y1:c.y,x2:endpoint.x,y2:endpoint.y,class:'stencil'},layer);
  make('line',{x1:c.x,y1:c.y,x2:endpoint.x,y2:endpoint.y,class:'hit','data-action':j<2?'rotateA':'rotateB'},layer);
  handle(endpoint,'arm'+j,'rotator',9);
 }
 handle(c,'move');
}
if(tool==='linear'){
 const {c,a,b}=model,arms=model.arms||(model.arms=[170,120,155]);
 linearHighlights();
 const norm=x=>(x%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
 const ccw=norm(b-a),start=ccw<Math.PI?a:a+Math.PI;
 const first=norm(b-start),endStraight=start+Math.PI;
 const leftGap=MARKER_GAP;
 congruentMarker(c,start+leftGap,start+first-leftGap,39,1);
 congruentMarker(c,start+first+leftGap,endStraight-leftGap,45,2);
 for(let j=0;j<3;j++){
  const t=j===0?a:j===1?a+Math.PI:b;
  const endpoint=plus(c,mul(direction(t),arms[j]));
  make('line',{x1:c.x,y1:c.y,x2:endpoint.x,y2:endpoint.y,class:'stencil'},layer);
  make('line',{x1:c.x,y1:c.y,x2:endpoint.x,y2:endpoint.y,class:'hit','data-action':j<2?'rotateA':'rotateB'},layer);
  handle(endpoint,'arm'+j,'rotator',9);
 }
 handle(c,'move');
}

if(tool==='parallel'){
 const {c,c2,a}=model;line(c,a,155,'stencil','rotateA');line(c2,a,155,'stencil alt','move2');
 const t=angle(c,c2),len=dist(c,c2),v=direction(t);
 // Transversal intersects BOTH parallel lines at their centers and extends beyond each.
 if(len>8){const p=minus(c,mul(v,65)),q=plus(c2,mul(v,65));
 make('line',{x1:p.x,y1:p.y,x2:q.x,y2:q.y,class:'stencil',stroke:'#a26a36'},layer);
 make('line',{x1:p.x,y1:p.y,x2:q.x,y2:q.y,class:'hit','data-action':'moveTransversal'},layer);
 actualSectors(c,a,t);actualSectors(c2,a,t);
 }
 handle(c,'move');handle(c2,'move2','handle alt');handle(plus(c,mul(direction(a),155)),'angleA','rotator');
 const i1=nearPoint(c,20),i2=nearPoint(c2,20);
 if(i1&&i2&&dist(i1,i2)>40){const common=scene.seg.find(s=>{const u=minus(s.b,s.a),len=Math.hypot(u.x,u.y);return Math.abs((i1.x-s.a.x)*u.y-(i1.y-s.a.y)*u.x)/len<4&&Math.abs((i2.x-s.a.x)*u.y-(i2.y-s.a.y)*u.x)/len<4});if(common)make('line',{x1:common.a.x,y1:common.a.y,x2:common.b.x,y2:common.b.y,class:'gold'},overlay)}
}
if(tool==='triangle'){const [a,b,c]=model.v;make('polygon',{points:model.v.map(p=>`${p.x},${p.y}`).join(' '),fill:'#7455bf','fill-opacity':'.035',stroke:'none'},layer);const sideColors=['#0785b0','#e47718','#168a45'];for(let j=0;j<3;j++){const u=model.v[j],v=model.v[(j+1)%3];make('line',{x1:u.x,y1:u.y,x2:v.x,y2:v.y,stroke:sideColors[(j+2)%3],'stroke-width':6,'stroke-linecap':'round','stroke-dasharray':'11 7','pointer-events':'none'},layer);make('line',{x1:u.x,y1:u.y,x2:v.x,y2:v.y,class:'hit','data-action':'move'},layer)}for(let i=0;i<3;i++){const p=model.v[i],prev=model.v[(i+2)%3],next=model.v[(i+1)%3],start=angle(p,next),end=angle(p,prev);let delta=((end-start)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);let s=start,e=end;if(delta>Math.PI){s=end;e=start;delta=2*Math.PI-delta}arc(p,s+.07,s+delta-.07,ANGLE_RADIUS,['arc-blue','arc-orange','arc-green'][i]);handle(p,'vertex'+i)}const centroid=mul(model.v.reduce((acc,p)=>plus(acc,p),pt(0,0)),1/3);handle(centroid,'move','handle',10)}
}
const selected=instances.find(x=>x.id===activeId);if(selected){tool=selected.kind;model=selected.model;}layer=rootLayer;overlay=rootOverlay;
}
function svgPoint(e){const m=svg.getScreenCTM();if(!m)return null;const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());return pt(p.x,p.y)}
svg.addEventListener('pointerdown',e=>{const action=e.target.getAttribute('data-action');if(!action)return;const owner=e.target.closest('[data-instance]');if(owner)selectInstance(Number(owner.dataset.instance));const p=svgPoint(e);if(!p)return;e.preventDefault();let base=tool==='triangle'?(action.startsWith('vertex')?model.v[+action.slice(-1)]:mul(model.v.reduce((s,v)=>plus(s,v),pt(0,0)),1/3)):action==='move2'?model.c2:model.c;drag={id:e.pointerId,instanceId:activeId,action,start:p,offset:minus(p,base),original:JSON.parse(JSON.stringify(model)),startAngle:tool==='triangle'?0:angle(model.c,p)};svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;selectInstance(drag.instanceId);const p=svgPoint(e);if(!p)return;e.preventDefault();const action=drag.action;if(action.startsWith('arm')){
 const j=Number(action.slice(3)),bearing=j===0?model.a:j===1?model.a+Math.PI:j===2&&tool==='vertical'?model.b:model.b+Math.PI;
 const t=tool==='linear'&&j===2?model.b:bearing;
 const v=minus(p,model.c);const projection=v.x*Math.cos(t)+v.y*Math.sin(t);
 model.arms[j]=clamp(projection,28,340);
}else if(tool==='triangle'){if(action.startsWith('vertex'))model.v[+action.slice(-1)]=pt(p.x-drag.offset.x,p.y-drag.offset.y);else{const delta=minus(p,drag.start);model.v=drag.original.v.map(v=>pt(v.x+delta.x,v.y+delta.y))}}else if(action==='move'||action==='move2'||action==='moveTransversal'){if(action==='moveTransversal'){const delta=minus(p,drag.start);model.c=plus(drag.original.c,delta);model.c2=plus(drag.original.c2,delta)}else{const key=action==='move2'?'c2':'c';model[key]=pt(p.x-drag.offset.x,p.y-drag.offset.y)}}else{const a=angle(model.c,p);const delta=Math.atan2(Math.sin(a-drag.startAngle),Math.cos(a-drag.startAngle));if(action==='angleA'||action==='rotateA')model.a=drag.original.a+delta;else model.b=drag.original.b+delta}draw()});
function finish(e){if(!drag||drag.id!==e.pointerId)return;selectInstance(drag.instanceId);if(e.clientY < svg.getBoundingClientRect().top){instances=instances.filter(x=>x.id!==activeId);activeId=instances.at(-1)?.id??null;drag=null;draw();return}const a=drag.action;if(tool==='triangle'){if(a.startsWith('vertex')){const i=+a.slice(-1),q=nearPoint(model.v[i],21);if(q)model.v[i]={...q}}}else if(a==='move'||a==='move2'||a==='moveTransversal'){if(a!=='moveTransversal'){const key=a==='move2'?'c2':'c',q=nearPoint(model[key],20);if(q)model[key]={...q}}}else if(a.startsWith('arm')){/* Arm length is independent of rotation. */}else if(a==='angleA'||a==='rotateA'){model.a=nearestDirection(model.a,model.c)}else if(a==='angleB'||a==='rotateB'){model.b=nearestDirection(model.b,model.c)}drag=null;draw()}
svg.addEventListener('pointerup',finish);svg.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.id){drag=null;draw()}});svg.addEventListener('lostpointercapture',e=>{if(drag&&e.pointerId===drag.id){drag=null;draw()}});
const descriptions={vertical:'Drag the center to move; drag either dashed line to rotate. Shaded angle regions remain visible before snapping. Drag an arm endpoint to change its length, or drag the arm to rotate.',linear:'Align the vertex and both rays to identify a linear pair. Both identified lines highlight continuously through their intersection; the shaded angle regions stay on the side containing the third ray.',parallel:'Drag the first line to rotate it; drag its center to move it. Slide the second without changing its direction.',triangle:'Drag a side to move the triangle; drag its vertices to reshape it. Each angle matches its opposite side: blue, orange, and green.'};for(const btn of document.querySelectorAll('[data-tool]'))btn.onclick=()=>{if(suppressPaletteClick)return;addInstance(btn.dataset.tool)};$('#newScene').onclick=()=>{customDefinition=null;variation++;setScene()};$('#family').onclick=()=>{customDefinition=null;familyIndex=(familyIndex+1)%families.length;variation=0;setScene()};$('#reset').onclick=resetTool;$('#toggle').onclick=()=>{instances=instances.filter(x=>x.id!==activeId);activeId=instances.at(-1)?.id??null;draw()};$('#exportJson').onclick=()=>downloadFile('geometry-diagram.json',JSON.stringify(scene.def,null,2),'application/json');
$('#importJson').onclick=()=>$('#jsonFile').click();
$('#jsonFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=validateDefinition(JSON.parse(await f.text()));customDefinition=d;setScene()}catch(err){alert('Could not import diagram: '+err.message)}e.target.value=''};
$('#exportSvg').onclick=()=>{const copy=svg.cloneNode(true);copy.querySelector('#overlay')?.remove();copy.querySelector('#stencilLayer')?.remove();copy.setAttribute('xmlns',NS);const style=document.createElementNS(NS,'style');style.textContent='.diagram{stroke:#667e8f;stroke-width:2.8;fill:none;stroke-linecap:round}.scene-point{fill:white;stroke:#667e8f;stroke-width:1.8}.scene-label{fill:#536d80;font:bold 23px Georgia,serif}';copy.prepend(style);downloadFile('geometry-diagram.svg',new XMLSerializer().serializeToString(copy),'image/svg+xml')};
function downloadFile(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

// Drag a toolbar icon into the canvas to place a template; return a template
// to the toolbar by dragging its center or a side above the canvas.
let paletteDrag=null,suppressPaletteClick=false;
for(const btn of document.querySelectorAll('[data-tool]')){
 btn.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  paletteDrag={id:e.pointerId,btn,x:e.clientX,y:e.clientY,started:false};
  btn.setPointerCapture(e.pointerId);
 });
 btn.addEventListener('pointermove',e=>{
  if(!paletteDrag||paletteDrag.id!==e.pointerId)return;
  if(!paletteDrag.started&&Math.hypot(e.clientX-paletteDrag.x,e.clientY-paletteDrag.y)>6){
   paletteDrag.started=true;addInstance(btn.dataset.tool);
   document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b===btn));
  }
  if(!paletteDrag.started)return;
  const p=svgPoint(e);if(!p)return;
  if(tool==='triangle'){
   const center=mul(model.v.reduce((a,b)=>plus(a,b),pt(0,0)),1/3);
   const delta=minus(p,center);model.v=model.v.map(v=>plus(v,delta));
  }else{
   const delta=minus(p,model.c);model.c=p;
   if(tool==='parallel')model.c2=plus(model.c2,delta);
  }
  draw();
 });
 btn.addEventListener('pointerup',e=>{
  if(!paletteDrag||paletteDrag.id!==e.pointerId)return;
  if(paletteDrag.started){
   suppressPaletteClick=true;
   if(e.clientY<svg.getBoundingClientRect().top){instances=instances.filter(x=>x.id!==activeId);activeId=instances.at(-1)?.id??null;draw()}
   else if(tool!=='triangle'){
    const q=nearPoint(model.c,20);if(q){const delta=minus(q,model.c);model.c=q;if(tool==='parallel')model.c2=plus(model.c2,delta)}
    draw();
   }
  }
  paletteDrag=null;
 });
 btn.addEventListener('pointercancel',()=>{paletteDrag=null});
 btn.addEventListener('click',e=>{if(suppressPaletteClick){e.stopImmediatePropagation();suppressPaletteClick=false}},true);
}

setScene();addInstance('vertical');
